name: NFL pregame evidence pilot
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: Reviewed plan directory in the selected checkout
        required: true
        type: string
      plan_sha256:
        description: Independent SHA-256 of plan.json
        required: true
        type: string
      authorized:
        description: Authorize this single live NFLverse capture
        required: true
        default: false
        type: boolean
      retention_days:
        description: Temporary artifact retention
        required: true
        type: choice
        default: '3'
        options: ['1', '3', '7']
permissions:
  contents: read
concurrency:
  group: nfl-weekly-refresh
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require confirmed zero-cost storage and explicit authorization
        env:
          CAPTURE_AUTHORIZED: ${{ inputs.authorized }}
          ARTIFACT_BUDGET_VERIFIED: ${{ vars.PREGAME_ARTIFACT_BUDGET_VERIFIED }}
        run: |
          if [[ "$CAPTURE_AUTHORIZED" != true || "$ARTIFACT_BUDGET_VERIFIED" != true ]]; then
            echo '::error::Use the local pilot until authorization and a zero-spend limit are confirmed.'
            exit 2
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Capture a single approved window
        id: capture
        env:
          PLAN_PATH: ${{ inputs.plan_path }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          folder = (root / os.environ["PLAN_PATH"]).resolve()
          if not folder.is_relative_to(root):
              raise SystemExit("Plan must be in the reviewed checkout")
          plan = folder / "plan.json"
          if plan.is_symlink() or hashlib.sha256(plan.read_bytes()).hexdigest() != os.environ["PLAN_SHA256"]:
              raise SystemExit("Plan digest mismatch")
          PY
          python -m nfl_betting.pregame_capture capture --plan "$PLAN_PATH" \
            --output "$RUNNER_TEMP/pregame-bundle" --authorized --for-actions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.capture.outcome == 'success'
        with:
          name: nfl-pregame-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pregame-bundle/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          overwrite: false
